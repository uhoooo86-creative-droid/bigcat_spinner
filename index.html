<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeatCat · 교사 유형 룰렛</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E8453C;
    --red-dark: #C4332A;
    --red-light: #FDECEA;
    --cream: #FFF8F4;
    --card-bg: #FFFFFF;
    --text: #1A1A1A;
    --text-muted: #888;
    --border: rgba(0,0,0,0.08);
    --shadow: 0 4px 20px rgba(232,69,60,0.12);
    --pill-bg: #F2F2F2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* Header */
  .header {
    background: var(--red);
    padding: 14px 20px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-logo {
    width: 36px; height: 36px;
    background: #fff;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .header-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 20px;
    color: #fff;
    letter-spacing: -0.3px;
  }
  .header-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.75);
    margin-left: auto;
    font-weight: 400;
  }

  /* Main */
  .main {
    max-width: 420px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--red);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-label::before {
    content: '';
    width: 3px; height: 12px;
    background: var(--red);
    border-radius: 2px;
    display: block;
  }

  /* Roulette */
  .roulette-wrap {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 0 auto 24px;
  }

  .roulette-wrap canvas {
    width: 280px; height: 280px;
    border-radius: 50%;
    display: block;
  }

  .roulette-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 3px solid rgba(232,69,60,0.18);
    pointer-events: none;
  }
  .roulette-ring-outer {
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    border: 1.5px dashed rgba(232,69,60,0.12);
    pointer-events: none;
    animation: spin-ring 20s linear infinite;
  }
  @keyframes spin-ring { to { transform: rotate(360deg); } }

  .pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.2));
  }

  .center-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 56px; height: 56px;
    border-radius: 50%;
    background: #fff;
    border: 2.5px solid var(--red);
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 11px;
    color: var(--red);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    line-height: 1.3;
    z-index: 20;
    box-shadow: 0 2px 10px rgba(232,69,60,.25);
    transition: transform .15s, box-shadow .15s;
  }
  .center-btn:hover { transform: translate(-50%,-50%) scale(1.06); box-shadow: 0 4px 16px rgba(232,69,60,.35); }
  .center-btn:disabled { opacity: .4; cursor: default; transform: translate(-50%,-50%); }

  /* Spin button */
  .spin-btn {
    width: 100%;
    padding: 14px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 16px;
    letter-spacing: -0.2px;
    cursor: pointer;
    margin-bottom: 20px;
    box-shadow: 0 4px 14px rgba(232,69,60,.35);
    transition: transform .12s, box-shadow .12s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .spin-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(232,69,60,.4); }
  .spin-btn:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(232,69,60,.3); }
  .spin-btn:disabled { opacity: .5; transform: none; cursor: default; }
  .spin-icon { font-size: 18px; animation: none; }
  .spin-btn.spinning .spin-icon { animation: spin-icon .5s linear infinite; }
  @keyframes spin-icon { to { transform: rotate(360deg); } }

  /* Result card */
  .result-card {
    background: var(--card-bg);
    border-radius: 18px;
    border: 1.5px solid var(--border);
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,.07);
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .35s, transform .35s;
    pointer-events: none;
  }
  .result-card.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .rc-top {
    background: var(--red);
    padding: 16px 18px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .rc-avatar {
    width: 48px; height: 48px;
    background: rgba(255,255,255,0.22);
    border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 15px;
    color: #fff;
    letter-spacing: -0.5px;
    flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,0.3);
  }
  .rc-title-wrap { flex: 1; }
  .rc-group-tag {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.9);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .8px;
    padding: 2px 8px;
    border-radius: 99px;
    margin-bottom: 4px;
  }
  .rc-type-name {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 20px;
    color: #fff;
    letter-spacing: -0.3px;
    line-height: 1;
  }
  .rc-name-ko {
    font-size: 12px;
    color: rgba(255,255,255,0.8);
    margin-top: 2px;
    font-weight: 400;
  }

  .rc-body { padding: 16px 18px; }

  .rc-feature {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .rc-speech {
    background: var(--red-light);
    border-left: 3px solid var(--red);
    border-radius: 0 10px 10px 0;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--red-dark);
    font-style: italic;
    line-height: 1.6;
    margin-bottom: 12px;
    font-weight: 500;
  }

  .rc-game-row {
    display: flex; align-items: center; gap: 8px;
  }
  .rc-game-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: .5px;
    flex-shrink: 0;
  }
  .rc-game-pill {
    background: var(--pill-bg);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 99px;
    line-height: 1;
  }

  .rc-footer {
    padding: 0 18px 16px;
  }
  .rc-more-btn {
    width: 100%;
    padding: 11px;
    background: #F7F7F7;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    transition: background .13s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .rc-more-btn:hover { background: #EFEFEF; }
  .rc-more-btn::after { content: '↗'; font-size: 14px; }

  /* Decorative cats */
  .deco-paw {
    text-align: center;
    font-size: 28px;
    margin: 6px 0 16px;
    opacity: .35;
    user-select: none;
    letter-spacing: 4px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">🐱</div>
  <span class="header-title">BeatCat</span>
  <span class="header-sub">교사 유형 룰렛</span>
</div>

<div class="main">
  <div class="deco-paw">🐾 🐾 🐾</div>

  <div class="section-label">유형 랜덤 선택</div>

  <div class="roulette-wrap" id="rouletteWrap">
    <div class="roulette-ring"></div>
    <div class="roulette-ring-outer"></div>
    <svg class="pointer" width="24" height="26" viewBox="0 0 24 26">
      <polygon points="12,2 22,24 12,19 2,24" fill="#E8453C" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
    <canvas id="wheel" width="560" height="560"></canvas>
    <button class="center-btn" id="centerBtn" onclick="spin()">GO!</button>
  </div>

  <button class="spin-btn" id="spinBtn" onclick="spin()">
    <span class="spin-icon">🎯</span>
    랜덤으로 교사 유형 뽑기
  </button>

  <div class="result-card" id="resultCard">
    <div class="rc-top">
      <div class="rc-avatar" id="rcAvatar">-</div>
      <div class="rc-title-wrap">
        <div class="rc-group-tag" id="rcGroup">-</div>
        <div class="rc-type-name" id="rcType">-</div>
        <div class="rc-name-ko" id="rcNameKo">-</div>
      </div>
    </div>
    <div class="rc-body">
      <div class="rc-feature" id="rcFeature">-</div>
      <div class="rc-speech" id="rcSolution">-</div>
      <div class="rc-game-row">
        <span class="rc-game-label">GAME</span>
        <span class="rc-game-pill" id="rcGame">-</span>
      </div>
    </div>
    <div class="rc-footer">
      <button class="rc-more-btn" id="moreBtn" onclick="askMore()">이 유형 더 자세히 보기</button>
    </div>
  </div>
</div>

<script>
const types = [
  { type:"INTJ", group:"NT 전략형", name:"전략형 교사", feature:"구조와 계획으로 수업을 설계하는 교사", solution:'"좋아, 이건 미션이야 — Step 1부터 하나씩 깨보자!"', game:"격파 뒤에 단어 꺼내가기", color:"#534AB7" },
  { type:"INTP", group:"NT 사고형", name:"사고형 교사", feature:"질문과 탐구로 수업을 확장하는 교사", solution:'"왜 그럴까? 우리 같이 이유를 찾아보자!"', game:"Why vs Because team", color:"#7F77DD" },
  { type:"ENTJ", group:"NT 리더형", name:"리더형 교사", feature:"목표와 결과 중심으로 수업을 이끄는 교사", solution:'"팀 나눠! 이긴 팀은 보너스 포인트 간다!"', game:"제곱승 보너스 카드", color:"#1D9E75" },
  { type:"ENTP", group:"NT 창의형", name:"창의형 교사", feature:"아이디어와 변화를 즐기는 즉흥형 교사", solution:'"잠깐! 새로운 규칙 추가 — 지금부터 이렇게 바꾼다!"', game:"노란불이 켜지면 wait~", color:"#5DCAA5" },
  { type:"INFJ", group:"NF 공감형", name:"공감형 교사", feature:"감정과 스토리로 몰입을 만드는 교사", solution:'"지금부터 우리가 주인공이야 — 이 문제를 함께 해결해보자"', game:"나야나! 주인공 역할놀이", color:"#EF9F27" },
  { type:"INFP", group:"NF 감성형", name:"감성형 교사", feature:"감정 표현과 창작을 이끌어내는 교사", solution:'"이걸 너만의 방식으로 표현해볼래?"', game:"단어 동작 같이 만들기", color:"#F9CB42" },
  { type:"ENFJ", group:"NF 리드형", name:"리드형 교사", feature:"관계와 참여를 이끌어내는 교사", solution:'"우리 다 같이 해보자! 서로 도와주면서!"', game:"2인3각 / 5인6각 마칭", color:"#D4537E" },
  { type:"ENFP", group:"NF 활력형", name:"활력형 교사", feature:"에너지와 리액션으로 분위기를 살리는 교사", solution:'"와 재밌다! 한 번 더! 더 크게 해보자!"', game:"Better than Me?", color:"#ED93B1" },
  { type:"ISTJ", group:"SJ 안정형", name:"안정형 교사", feature:"루틴과 체계로 안정적인 수업을 만드는 교사", solution:'"좋아, 같은 방식으로 한 번 더 반복해보자"', game:"Whisper Say", color:"#3B6D11" },
  { type:"ISFJ", group:"SJ 케어형", name:"케어형 교사", feature:"아이를 세심하게 케어하는 따뜻한 교사", solution:'"괜찮아, 천천히 해도 돼 — 선생님이 같이 할게"', game:"중력 vs 무중력 / 거북이놀이", color:"#639922" },
  { type:"ESTJ", group:"SJ 규율형", name:"규율형 교사", feature:"규칙과 통제로 수업을 정확히 운영하는 교사", solution:'"규칙 기억! 지금은 차례 지켜서 진행한다!"', game:"군대 BGM 교실 룰", color:"#185FA5" },
  { type:"ESFJ", group:"SJ 소통형", name:"소통형 교사", feature:"칭찬과 소통으로 분위기를 만드는 교사", solution:'"와 너무 잘했어! 친구들도 같이 박수!"', game:"Good Job song / 구호 만들기", color:"#378ADD" },
  { type:"ISTP", group:"SP 실습형", name:"실습형 교사", feature:"직접 해보게 만드는 실습 중심 교사", solution:'"말 말고 직접 해보자 — 손으로 해보면 바로 알 수 있어"', game:"Partner Activity", color:"#D85A30" },
  { type:"ISFP", group:"SP 감각형", name:"감각형 교사", feature:"감각과 예술로 표현을 이끄는 교사", solution:'"느낌대로 해도 좋아 — 자유롭게 만들어봐"', game:"감정 색·선으로 형용사 표현", color:"#F0997B" },
  { type:"ESTP", group:"SP 액션형", name:"액션형 교사", feature:"빠른 템포와 액션으로 수업을 살리는 교사", solution:'"준비! 시작! 빨리 움직이는 사람이 이긴다!"', game:"5번 말하고 I am the number one!", color:"#5F5E5A" },
  { type:"ESFP", group:"SP 무대형", name:"무대형 교사", feature:"퍼포먼스로 아이를 끌어당기는 교사", solution:'"좋아! 지금부터 무대야 — 멋지게 보여줘!"', game:"골 세레모니 룰렛", color:"#E8453C" },
];

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const N = types.length;
const arc = (2 * Math.PI) / N;
let currentAngle = 0;
let spinning = false;
let selectedType = null;

function drawWheel(angle) {
  ctx.clearRect(0, 0, 560, 560);
  const cx = 280, cy = 280, r = 272;

  for (let i = 0; i < N; i++) {
    const start = angle + i * arc - Math.PI / 2;
    const end = start + arc;
    const t = types[i];

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = t.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + arc / 2);

    const labelR = r * 0.67;
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.font = '700 17px "Nunito", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t.type, labelR, 0);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(cx, cy, 34, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#E8453C';
  ctx.lineWidth = 2.5;
  ctx.stroke();
}

drawWheel(0);

function spin() {
  if (spinning) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('spinBtn').classList.add('spinning');
  document.getElementById('centerBtn').disabled = true;
  document.getElementById('resultCard').classList.remove('show');

  const extraSpins = (Math.floor(Math.random() * 5) + 7) * 2 * Math.PI;
  const targetSlice = Math.floor(Math.random() * N);
  const targetAngle = extraSpins + (2 * Math.PI - targetSlice * arc) - (arc / 2);

  const startAngle = currentAngle;
  const totalDelta = targetAngle;
  const duration = 4000;
  const startTime = performance.now();

  function easeOut(t) { return 1 - Math.pow(1 - t, 4.5); }

  function frame(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = easeOut(progress);
    currentAngle = startAngle + totalDelta * eased;
    drawWheel(currentAngle % (2 * Math.PI));

    if (progress < 1) {
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      document.getElementById('spinBtn').classList.remove('spinning');
      document.getElementById('centerBtn').disabled = false;
      selectedType = types[targetSlice];
      showResult(selectedType);
    }
  }
  requestAnimationFrame(frame);
}

function showResult(t) {
  document.getElementById('rcAvatar').textContent = t.type;
  document.getElementById('rcGroup').textContent = t.group;
  document.getElementById('rcType').textContent = t.type;
  document.getElementById('rcNameKo').textContent = t.name;
  document.getElementById('rcFeature').textContent = t.feature;
  document.getElementById('rcSolution').textContent = t.solution;
  document.getElementById('rcGame').textContent = t.game;
  document.getElementById('resultCard').classList.add('show');
}

function askMore() {
  if (selectedType && typeof sendPrompt === 'function') {
    sendPrompt(selectedType.type + ' 교사 유형의 수업 방식과 게임 활동을 더 자세히 설명해줘');
  }
}
</script>
</body>
</html>
