<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐱 빅캣 알파벳 롤 탐정게임</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+KR:wght@400;700;900&display=swap');
:root{
  --gold:#F5A623;--gold-dark:#C07D10;--gold-light:#FFD878;
  --brown:#5C3A1E;--cream:#FFF8E7;
  --red:#E53935;--green:#43A047;--blue:#1E88E5;--purple:#8E24AA;
  --shadow:rgba(92,58,30,0.25);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito','Noto Sans KR',sans-serif;background:linear-gradient(135deg,#FFE082 0%,#FFF8E7 50%,#FFD54F 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 60px;overflow-x:hidden;}

/* TITLE */
.title-block{text-align:center;margin-bottom:14px;}
.title-sub{font-size:12px;font-weight:700;background:var(--brown);color:var(--gold-light);padding:3px 14px;border-radius:20px;display:inline-block;margin-bottom:5px;letter-spacing:2px;}
.title-main{font-size:clamp(20px,5vw,32px);font-weight:900;color:var(--brown);line-height:1.1;text-shadow:2px 2px 0 var(--gold-light);}
.title-tagline{font-size:13px;color:var(--gold-dark);font-weight:700;margin-top:3px;}

/* TABS */
.tabs{display:flex;gap:0;margin-bottom:0;width:100%;max-width:960px;}
.tab-btn{flex:1;padding:10px 0;font-family:inherit;font-size:14px;font-weight:900;border:3px solid var(--brown);background:#fff;color:var(--brown);cursor:pointer;border-bottom:none;border-radius:14px 14px 0 0;margin-right:4px;transition:background .15s;}
.tab-btn:last-child{margin-right:0;}
.tab-btn.active{background:var(--gold-light);}

.panel{display:none;width:100%;max-width:960px;background:var(--cream);border:3px solid var(--brown);border-radius:0 16px 16px 16px;padding:20px 16px;box-shadow:0 6px 24px var(--shadow);}
.panel.active{display:block;}

/* EDITOR */
.editor-top{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.editor-box{background:#fff;border:2.5px solid var(--gold);border-radius:14px;padding:14px 16px;flex:1;min-width:200px;box-shadow:0 2px 8px var(--shadow);}
.editor-box label{display:block;font-size:12px;font-weight:900;color:var(--gold-dark);margin-bottom:7px;letter-spacing:1px;}
.input-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.word-input{border:2px solid #ddd;border-radius:10px;padding:8px 11px;font-family:inherit;font-size:15px;font-weight:900;text-transform:uppercase;width:100px;color:var(--brown);outline:none;transition:border-color .2s;}
.word-input:focus{border-color:var(--gold);}
.emoji-input{border:2px solid #ddd;border-radius:10px;padding:8px 9px;font-size:19px;width:52px;text-align:center;outline:none;}
.emoji-input:focus{border-color:var(--gold);}
.add-btn{padding:8px 16px;background:linear-gradient(180deg,#FFE566,#F5A623);border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:900;color:var(--brown);cursor:pointer;box-shadow:0 3px 0 var(--gold-dark);transition:transform .1s,box-shadow .1s;white-space:nowrap;}
.add-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-dark);}
.bulk-textarea{width:100%;border:2px solid #ddd;border-radius:10px;padding:8px 11px;font-family:inherit;font-size:13px;resize:vertical;min-height:78px;outline:none;color:var(--brown);}
.bulk-textarea:focus{border-color:var(--gold);}
.bulk-hint{font-size:10px;color:#bbb;margin-top:3px;}
.bulk-apply-btn{margin-top:7px;padding:7px 15px;background:var(--brown);border:none;border-radius:10px;font-family:inherit;font-size:12px;font-weight:900;color:#fff;cursor:pointer;}
.bulk-apply-btn:hover{opacity:.85;}
.word-list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.word-list-title{font-size:13px;font-weight:900;color:var(--brown);}
.len-badge{display:inline-block;font-size:10px;background:#f0e0c0;color:var(--brown);border-radius:8px;padding:1px 6px;font-weight:700;margin-left:4px;}
.clear-btn{padding:4px 11px;background:#fff;border:2px solid var(--red);border-radius:8px;font-family:inherit;font-size:12px;font-weight:900;color:var(--red);cursor:pointer;}
.clear-btn:hover{background:#FFEBEE;}
.word-grid{display:flex;flex-wrap:wrap;gap:7px;}
.word-chip{display:flex;align-items:center;gap:5px;background:#fff;border:2.5px solid var(--gold);border-radius:11px;padding:5px 9px 5px 11px;font-size:13px;font-weight:900;color:var(--brown);}
.chip-del{background:none;border:none;font-size:15px;cursor:pointer;color:#ccc;padding:0 0 0 3px;line-height:1;font-weight:900;}
.chip-del:hover{color:var(--red);}
.apply-game-btn{display:block;margin:16px auto 0;padding:11px 36px;background:linear-gradient(180deg,#FFE566,#F5A623);border:none;border-radius:50px;font-family:inherit;font-size:16px;font-weight:900;color:var(--brown);cursor:pointer;box-shadow:0 5px 0 var(--gold-dark);transition:transform .1s,box-shadow .1s;}
.apply-game-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-dark);}

/* GAME */
.game-layout{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;}

/* Lock body */
.lock-machine{background:linear-gradient(160deg,#F5C842 0%,#C07D10 100%);border-radius:36px;padding:18px 18px 22px;box-shadow:0 8px 32px var(--shadow),inset 0 2px 0 rgba(255,255,255,.3);position:relative;width:100%;max-width:540px;}
.shackle{width:100px;height:52px;border:15px solid #B0BEC5;border-bottom:none;border-radius:50px 50px 0 0;margin:0 auto -6px;box-shadow:inset 0 3px 8px rgba(0,0,0,.18),0 2px 0 #90A4AE;position:relative;}
.shackle::after{content:'';position:absolute;top:3px;left:3px;right:3px;height:18px;border:5px solid rgba(255,255,255,.18);border-bottom:none;border-radius:32px 32px 0 0;}

/* Dark roller panel */
.rollers-wrap{background:linear-gradient(180deg,#7a5010 0%,#5C3A1E 100%);border-radius:22px;padding:12px 12px 14px;display:flex;gap:8px;justify-content:center;box-shadow:inset 0 4px 16px rgba(0,0,0,.4),0 4px 0 rgba(0,0,0,.2);flex-wrap:wrap;}

/* One roller column */
.roller-col{display:flex;flex-direction:column;align-items:center;gap:4px;}
.roller-num{width:20px;height:20px;background:#333;border-radius:50%;color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ▲ ▼ nudge buttons */
.nudge-btn{
  width:68px;height:24px;
  background:rgba(255,255,255,.18);border:none;border-radius:7px;
  color:rgba(255,255,255,.9);font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .12s;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
.nudge-btn:hover{background:rgba(255,255,255,.3);}
.nudge-btn:active{background:rgba(255,255,255,.45);}

/* The slot window — shows 3 rows, middle is active */
.slot{
  width:68px;
  height:150px;   /* exactly 3 × ITEM_H=50px */
  overflow:hidden;
  border-radius:12px;
  background:#fff;
  border:3px solid rgba(255,255,255,.25);
  box-shadow:0 4px 12px rgba(0,0,0,.35);
  position:relative;
  cursor:grab;
  user-select:none;-webkit-user-select:none;
  touch-action:none;
  flex-shrink:0;
}
.slot:active{cursor:grabbing;}
/* fade edges */
.slot::before,.slot::after{content:'';position:absolute;left:0;right:0;height:40px;z-index:3;pointer-events:none;}
.slot::before{top:0;background:linear-gradient(to bottom,rgba(255,255,255,.95),transparent);}
.slot::after{bottom:0;background:linear-gradient(to top,rgba(255,255,255,.95),transparent);}
/* center highlight */
.slot-hl{position:absolute;top:50px;left:0;right:0;height:50px;background:rgba(255,230,60,.2);border-top:2px solid rgba(180,140,0,.4);border-bottom:2px solid rgba(180,140,0,.4);z-index:2;pointer-events:none;}

/* The moving strip — rendered via JS translateY */
.slot-inner{position:absolute;top:0;left:0;right:0;will-change:transform;}

/* Each letter cell — exactly ITEM_H=50px */
.slot-item{
  height:50px;width:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:900;
  pointer-events:none;user-select:none;
}
/* 4-color cycle */
.slot-item:nth-child(4n+1){color:var(--red);}
.slot-item:nth-child(4n+2){color:var(--green);}
.slot-item:nth-child(4n+3){color:var(--blue);}
.slot-item:nth-child(4n+0){color:var(--purple);}

/* Locked slot: red tint + overlay */
.slot.locked{border-color:rgba(229,57,53,.8);background:#FFF5F5;}
.slot-lock-overlay{
  display:none;
  position:absolute;
  bottom:5px;right:5px;
  z-index:6;
  width:20px;height:20px;
  border-radius:50%;
  background:rgba(210,30,30,.88);
  align-items:center;justify-content:center;
  font-size:11px;
  pointer-events:none;
  box-shadow:0 1px 4px rgba(0,0,0,.35);
}
.slot.locked .slot-lock-overlay{display:flex;}

/* Lock toggle button */
.lock-btn{
  width:68px;padding:5px 0;
  border:none;border-radius:8px;font-family:inherit;font-size:11px;font-weight:900;
  cursor:pointer;flex-shrink:0;transition:transform .1s;
}
.lock-btn:active{transform:translateY(1px);}
.lock-btn.unlocked{background:rgba(255,255,255,.2);color:rgba(255,255,255,.85);}
.lock-btn.unlocked:hover{background:rgba(255,255,255,.35);}
.lock-btn.locked{background:linear-gradient(180deg,#ff6b6b,#c0392b);color:#fff;box-shadow:0 2px 0 #922b21;}

/* STOP button (per slot, during spin) */
.stop-btn{
  width:68px;padding:5px 0;
  background:linear-gradient(180deg,#ff8a80,#E53935);border:none;border-radius:8px;
  font-family:inherit;font-size:11px;font-weight:900;color:#fff;cursor:pointer;
  box-shadow:0 3px 0 #b71c1c;transition:transform .1s,opacity .15s;flex-shrink:0;
}
.stop-btn:active{transform:translateY(2px);}
.stop-btn:disabled{opacity:.35;cursor:default;transform:none;}
.stop-btn.done{background:linear-gradient(180deg,#aaa,#888);box-shadow:0 2px 0 #555;}

/* Keyhole */
.keyhole{width:24px;height:36px;background:#1a0a00;border-radius:50% 50% 4px 4px;margin:10px auto 0;box-shadow:inset 0 2px 6px rgba(0,0,0,.5);position:relative;}
.keyhole::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:9px;height:15px;background:#1a0a00;border-radius:0 0 4px 4px;}

/* Main buttons */
.btn-row{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
.spin-btn{padding:11px 28px;background:linear-gradient(180deg,#FFE566,#F5A623);border:none;border-radius:50px;font-family:inherit;font-size:16px;font-weight:900;color:var(--brown);cursor:pointer;box-shadow:0 5px 0 var(--gold-dark);transition:transform .1s,box-shadow .1s;}
.spin-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-dark);}
.spin-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.stopall-btn{padding:11px 20px;background:linear-gradient(180deg,#ff8a80,#E53935);border:none;border-radius:50px;font-family:inherit;font-size:14px;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 5px 0 #b71c1c;transition:transform .1s,opacity .15s;}
.stopall-btn:active{transform:translateY(3px);}
.stopall-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* Legend */
.mode-legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:9px;padding:7px 12px;background:rgba(0,0,0,.13);border-radius:12px;}
.legend-item{font-size:11px;color:rgba(255,255,255,.85);font-weight:700;}

/* Cat speech */
.cat-speech{position:absolute;top:-10px;right:10px;background:#fff;border:2.5px solid var(--gold);border-radius:12px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--brown);white-space:nowrap;box-shadow:0 2px 8px var(--shadow);z-index:10;display:none;}
.cat-speech.show{display:block;animation:pop .3s ease;}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

/* Result */
.result-display{background:#fff;border:4px solid var(--gold);border-radius:16px;padding:11px 18px;margin-top:11px;text-align:center;box-shadow:0 4px 16px var(--shadow);display:flex;flex-direction:column;align-items:center;}
.result-label{font-size:11px;color:var(--gold-dark);font-weight:700;}
.result-word{font-size:32px;font-weight:900;letter-spacing:4px;display:flex;gap:2px;align-items:center;flex-wrap:wrap;justify-content:center;}
.rw-char{min-width:28px;text-align:center;}
.rw-char.spinning{opacity:.25;}
.rw-1{color:var(--red);}.rw-2{color:var(--green);}.rw-3{color:var(--blue);}.rw-4{color:var(--purple);}
.result-match{font-size:13px;font-weight:900;margin-top:5px;padding:3px 14px;border-radius:20px;display:none;}
.result-match.show{display:inline-block;}
.result-match.hit{background:#E8F5E9;color:#2E7D32;border:2px solid #81C784;}
.result-match.miss{background:#FFF3E0;color:#E65100;border:2px solid #FFCC02;}

/* Right panel */
.right-panel{display:flex;flex-direction:column;gap:13px;flex:1;min-width:220px;max-width:310px;}
.card-deck{background:var(--cream);border:3px solid var(--gold);border-radius:16px;padding:13px;box-shadow:0 4px 16px var(--shadow);}
.deck-title{font-size:12px;font-weight:900;color:var(--brown);margin-bottom:9px;}
.word-cards{display:flex;flex-wrap:wrap;gap:6px;}
.word-card{background:#fff;border:2.5px solid #ddd;border-radius:9px;padding:6px 9px;text-align:center;font-size:11px;font-weight:900;color:var(--brown);min-width:54px;}
.word-card .card-emoji{font-size:17px;display:block;margin-bottom:1px;}
.word-card.found{background:#E8F5E9;border-color:#81C784;color:#2E7D32;text-decoration:line-through;opacity:.7;}
.score-panel{background:var(--brown);border-radius:16px;padding:13px;color:#fff;text-align:center;box-shadow:0 4px 16px var(--shadow);}
.score-title{font-size:11px;opacity:.8;font-weight:700;letter-spacing:1px;margin-bottom:3px;}
.score-num{font-size:42px;font-weight:900;color:var(--gold-light);line-height:1;}
.score-sub{font-size:10px;opacity:.7;margin-top:2px;}
.found-list{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:7px;}
.found-tag{background:var(--gold-light);color:var(--brown);font-size:10px;font-weight:900;padding:2px 8px;border-radius:20px;letter-spacing:1px;}
.history-log{background:var(--cream);border:3px solid var(--gold);border-radius:16px;padding:11px;max-height:130px;overflow-y:auto;box-shadow:0 4px 16px var(--shadow);}
.history-title{font-size:11px;font-weight:900;color:var(--brown);margin-bottom:5px;}
.history-item{font-size:11px;padding:3px 0;border-bottom:1px solid #f0e0c0;display:flex;align-items:center;gap:6px;}
.history-item:last-child{border-bottom:none;}
.h-word{font-weight:900;letter-spacing:2px;}
.h-hit{color:#2E7D32;}.h-miss{color:#9E9E9E;}

/* Toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--brown);color:#fff;padding:9px 22px;border-radius:30px;font-size:13px;font-weight:900;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:1000;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;}

@media(max-width:500px){
  .slot,.nudge-btn,.lock-btn,.stop-btn{width:56px;}
  .slot-item{font-size:22px;}
  .rollers-wrap{gap:5px;padding:10px 7px 12px;}
}
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="toast" id="toast"></div>

<div class="title-block">
  <div class="title-sub">🐾 BIG CAT</div>
  <div class="title-main">알파벳 롤 탐정게임</div>
  <div class="title-tagline">알파벳을 돌려 단어를 찾아라! 🔍</div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('game')">🎮 게임</button>
  <button class="tab-btn" onclick="switchTab('editor')">✏️ 단어 편집</button>
</div>

<!-- EDITOR -->
<div class="panel" id="panel-editor">
  <div class="editor-top">
    <div class="editor-box">
      <label>단어 추가 (영문)</label>
      <div class="input-row">
        <input class="word-input" id="wordInput" type="text" maxlength="8" placeholder="CATS" oninput="this.value=this.value.toUpperCase()">
        <input class="emoji-input" id="emojiInput" type="text" placeholder="🐱" maxlength="2">
        <button class="add-btn" onclick="addWord()">+ 추가</button>
      </div>
    </div>
    <div class="editor-box">
      <label>여러 단어 한번에 추가</label>
      <textarea class="bulk-textarea" id="bulkInput" placeholder="CATS 🐱&#10;DOGS 🐶&#10;BIRD 🐦"></textarea>
      <div class="bulk-hint">형식: 단어 이모지 (줄마다 하나, 이모지 생략 가능)</div>
      <button class="bulk-apply-btn" onclick="bulkAdd()">📋 일괄 추가</button>
    </div>
  </div>
  <div class="word-list-header">
    <div class="word-list-title">📝 단어 목록 <span id="wordCount" class="len-badge">0개</span></div>
    <button class="clear-btn" onclick="clearAll()">🗑️ 전체 삭제</button>
  </div>
  <div class="word-grid" id="wordGrid"></div>
  <button class="apply-game-btn" onclick="applyToGame()">▶ 게임에 적용하기</button>
</div>

<!-- GAME -->
<div class="panel active" id="panel-game">
  <div class="game-layout">
    <div class="lock-machine">
      <div class="cat-speech" id="catSpeech">🐱 드래그나 ▲▼로 맞추고 🔒 잠금!</div>
      <div class="shackle"></div>
      <div class="rollers-wrap" id="rollersWrap"></div>
      <div class="keyhole"></div>
      <div class="btn-row">
        <button class="spin-btn" id="spinBtn" onclick="spin()">🔄 ALL SPIN</button>
        <button class="stopall-btn" id="stopAllBtn" onclick="stopAll()" disabled>⏹ ALL STOP</button>
      </div>
      <div class="mode-legend">
        <div class="legend-item">☝️ 드래그 또는 ▲▼로 글자 선택</div>
        <div class="legend-item">🔒 잠금 = SPIN해도 고정</div>
      </div>
      <div class="result-display">
        <div class="result-label">현재 단어</div>
        <div class="result-word" id="resultWord"></div>
        <div class="result-match" id="resultMatch"></div>
      </div>
    </div>

    <div class="right-panel">
      <div class="card-deck">
        <div class="deck-title">🃏 단어 카드</div>
        <div class="word-cards" id="wordCards"></div>
      </div>
      <div class="score-panel">
        <div class="score-title">🏆 찾은 단어</div>
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-sub">/ <span id="totalWords">0</span> 단어</div>
        <div class="found-list" id="foundList"></div>
      </div>
      <div class="history-log">
        <div class="history-title">📜 스핀 기록</div>
        <div id="historyLog"><div style="font-size:11px;color:#aaa">스핀을 눌러봐요!</div></div>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
//  CORE DESIGN
//
//  Each slot shows 3 items (top=dim, mid=active, bot=dim).
//  ITEM_H = 50px  →  slot height = 150px.
//
//  The strip contains 5 copies of A-Z (= 130 items).
//  We always render based on a single source-of-truth:
//    slotIdx[col]  — integer 0-129, the item shown in CENTER
//
//  translateY = -(slotIdx * ITEM_H) + ITEM_H
//    (shifts the strip so item[slotIdx] is at y=ITEM_H inside slot,
//     which is the center row because slot height=150 and rows are 50px each)
//
//  That formula is the ONLY formula used everywhere.
//  No floating point ambiguity.
// ═══════════════════════════════════════════════

const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const ITEM_H   = 50;   // px — must match CSS .slot-item height
const COPIES   = 9;    // how many A-Z copies in the strip
const STRIP_N  = COPIES * 26;        // 234 items
const MID_START = Math.floor(COPIES / 2) * 26;  // middle copy start index

// Given an absolute strip index → pixel translateY
function idxToY(idx) { return -(idx * ITEM_H) + ITEM_H; }

// Given a translateY → nearest absolute strip index
function yToIdx(y, total) {
  const raw = (-y + ITEM_H) / ITEM_H;
  return Math.max(0, Math.min(total - 1, Math.round(raw)));
}

// Circular letter from strip index
function idxToLetter(i) { return ALPHABET[((i % 26) + 26) % 26]; }

// ── state ──
const DEFAULT_WORDS = [
  {word:'BATS',emoji:'🏏'},{word:'CATS',emoji:'🐱'},{word:'RATS',emoji:'🐭'},
  {word:'MATS',emoji:'🪣'},{word:'HATS',emoji:'🎩'},{word:'FLAT',emoji:'🏠'},
  {word:'CRAB',emoji:'🦀'},{word:'DRUM',emoji:'🥁'},{word:'FROG',emoji:'🐸'},
  {word:'SHIP',emoji:'🚢'},{word:'KING',emoji:'👑'},{word:'JUMP',emoji:'🦘'},
  {word:'WIND',emoji:'💨'},{word:'STAR',emoji:'⭐'},{word:'MOON',emoji:'🌙'},
];
let wordList     = [...DEFAULT_WORDS];
let sessionWords = [...DEFAULT_WORDS];
let foundWords   = new Set();
let history      = [];
let numSlots     = 4;

let slotIdx      = [];   // integer — current center item index in the strip
let slotLocked   = [];   // bool
let slotSpinning = [];   // bool
let slotRAF      = [];   // animation frame id during auto-spin

// ── animation helper: smooth tween slotIdx → targetIdx ──
function animateTo(col, targetIdx, duration, onDone) {
  const inner   = document.getElementById('inner' + col);
  if (!inner) return;
  const startY  = idxToY(slotIdx[col]);
  const endY    = idxToY(targetIdx);
  const startT  = performance.now();
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function frame(now) {
    const t = Math.min((now - startT) / duration, 1);
    const y = startY + (endY - startY) * easeOut(t);
    inner.style.transform = 'translateY(' + y + 'px)';
    if (t < 1) {
      slotRAF[col] = requestAnimationFrame(frame);
    } else {
      // Snap exactly
      inner.style.transform = 'translateY(' + endY + 'px)';
      slotIdx[col] = targetIdx;
      if (onDone) onDone();
    }
  }
  if (slotRAF[col]) cancelAnimationFrame(slotRAF[col]);
  slotRAF[col] = requestAnimationFrame(frame);
}

// ── snap current visual position to nearest integer idx ──
function snapToNearest(col) {
  const inner = document.getElementById('inner' + col);
  if (!inner) return;
  const curY = parseFloat(inner.style.transform.replace(/[^0-9.\-]/g, '') || '0');
  // re-parse translateY properly
  const m = inner.style.transform.match(/translateY\((-?[\d.]+)px\)/);
  const y = m ? parseFloat(m[1]) : idxToY(slotIdx[col]);
  const nearest = yToIdx(y, STRIP_N);
  animateTo(col, nearest, 200, () => {
    slotIdx[col] = nearest;
    updateResultChar(col);
  });
}

// ═══════════════════════════════════════════════
//  BUILD SLOTS
// ═══════════════════════════════════════════════
function buildSlots() {
  numSlots = Math.min(sessionWords.reduce((mx, w) => Math.max(mx, w.word.length), 2), 8);

  // Preserve existing state where possible
  const prevIdx    = slotIdx.slice();
  const prevLocked = slotLocked.slice();

  slotIdx      = Array.from({length: numSlots}, (_, i) => prevIdx[i]    != null ? prevIdx[i]    : MID_START + i % 26);
  slotLocked   = Array.from({length: numSlots}, (_, i) => prevLocked[i] != null ? prevLocked[i] : false);
  slotSpinning = Array(numSlots).fill(false);
  slotRAF      = Array(numSlots).fill(null);

  const wrap = document.getElementById('rollersWrap');
  wrap.innerHTML = '';

  for (let c = 0; c < numSlots; c++) {
    const col = document.createElement('div');
    col.className = 'roller-col';
    col.innerHTML = `
      <div class="roller-num">${['①','②','③','④','⑤','⑥','⑦','⑧'][c]}</div>
      <button class="nudge-btn" id="nudgeUp${c}">▲</button>
      <div class="slot${slotLocked[c] ? ' locked' : ''}" id="slot${c}">
        <div class="slot-hl"></div>
        <div class="slot-inner" id="inner${c}" style="transform:translateY(${idxToY(slotIdx[c])}px)"></div>
        <div class="slot-lock-overlay">🔒</div>

      </div>
      <button class="nudge-btn" id="nudgeDown${c}">▼</button>
      <button class="lock-btn ${slotLocked[c] ? 'locked' : 'unlocked'}" id="lockBtn${c}">${slotLocked[c] ? '🔒 고정됨' : '🔓 잠금'}</button>
      <button class="stop-btn${slotSpinning[c] ? '' : ' done'}" id="stopBtn${c}" disabled>■ STOP</button>
    `;
    wrap.appendChild(col);

    // Fill strip  (A-Z × COPIES)
    const inner = document.getElementById('inner' + c);
    const frag  = document.createDocumentFragment();
    for (let r = 0; r < COPIES; r++) {
      for (let a = 0; a < 26; a++) {
        const d = document.createElement('div');
        d.className = 'slot-item';
        d.textContent = ALPHABET[a];
        frag.appendChild(d);
      }
    }
    inner.appendChild(frag);

    // Wire events
    document.getElementById('nudgeUp'   + c).addEventListener('mousedown',  () => startNudge(c, -1));
    document.getElementById('nudgeUp'   + c).addEventListener('touchstart',  e => { e.preventDefault(); startNudge(c, -1); }, {passive:false});
    document.getElementById('nudgeDown' + c).addEventListener('mousedown',  () => startNudge(c, +1));
    document.getElementById('nudgeDown' + c).addEventListener('touchstart',  e => { e.preventDefault(); startNudge(c, +1); }, {passive:false});
    document.getElementById('lockBtn'   + c).addEventListener('click',      () => toggleLock(c));
    document.getElementById('stopBtn'   + c).addEventListener('click',      () => stopSlot(c));
    attachDrag(c);
  }

  // Stop nudge on mouseup / touchend (global)
  window.addEventListener('mouseup',   stopNudge);
  window.addEventListener('touchend',  stopNudge);

  // Result word display
  buildResultWord();
}

// ═══════════════════════════════════════════════
//  DRAG  (accumulates pixel delta → changes idx)
// ═══════════════════════════════════════════════
const DRAG_THRESHOLD = ITEM_H; // drag ITEM_H pixels to advance one step

function attachDrag(col) {
  const slot = document.getElementById('slot' + col);
  let active    = false;
  let startY    = 0;
  let lastY     = 0;
  let startIdx  = 0;
  let accumulated = 0;  // leftover sub-step pixels

  function onStart(clientY) {
    if (slotLocked[col] || slotSpinning[col]) return;
    if (slotRAF[col]) { cancelAnimationFrame(slotRAF[col]); slotRAF[col] = null; }
    active      = true;
    startY      = clientY;
    lastY       = clientY;
    startIdx    = slotIdx[col];
    accumulated = 0;
  }

  function onMove(clientY) {
    if (!active) return;
    const dy    = lastY - clientY;  // positive dy = dragging up = next letter
    lastY       = clientY;
    accumulated += dy;

    // How many steps?
    const steps = Math.trunc(accumulated / DRAG_THRESHOLD);
    if (steps !== 0) {
      accumulated -= steps * DRAG_THRESHOLD;
      const newIdx = Math.max(0, Math.min(STRIP_N - 1, slotIdx[col] + steps));
      slotIdx[col] = newIdx;
      // Instant position (no animation during drag)
      const inner = document.getElementById('inner' + col);
      if (inner) inner.style.transform = 'translateY(' + idxToY(newIdx) + 'px)';
      updateResultChar(col);
    }
  }

  function onEnd() {
    if (!active) return;
    active = false;
    // Snap to the current integer idx (already integer, but run snap to be safe)
    const inner = document.getElementById('inner' + col);
    if (inner) {
      inner.style.transform = 'translateY(' + idxToY(slotIdx[col]) + 'px)';
    }
    updateResultChar(col);
  }

  slot.addEventListener('mousedown',  e => { e.preventDefault(); onStart(e.clientY); });
  slot.addEventListener('touchstart', e => { e.preventDefault(); onStart(e.touches[0].clientY); }, {passive:false});
  window.addEventListener('mousemove', e => onMove(e.clientY));
  slot.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e.touches[0].clientY); }, {passive:false});
  window.addEventListener('mouseup',   onEnd);
  slot.addEventListener('touchend',   onEnd);
}

// ═══════════════════════════════════════════════
//  NUDGE  (▲ ▼ buttons — hold to repeat)
// ═══════════════════════════════════════════════
let nudgeTimer = null;
let nudgeInterval = null;

function startNudge(col, dir) {
  if (slotLocked[col] || slotSpinning[col]) return;
  doNudge(col, dir);
  nudgeTimer = setTimeout(() => {
    nudgeInterval = setInterval(() => doNudge(col, dir), 100);
  }, 350);
}
function stopNudge() {
  clearTimeout(nudgeTimer);
  clearInterval(nudgeInterval);
  nudgeTimer = nudgeInterval = null;
}
function doNudge(col, dir) {
  if (slotLocked[col] || slotSpinning[col]) return;
  const newIdx = Math.max(0, Math.min(STRIP_N - 1, slotIdx[col] + dir));
  animateTo(col, newIdx, 120, () => {
    slotIdx[col] = newIdx;
    updateResultChar(col);
  });
}

// ═══════════════════════════════════════════════
//  LOCK TOGGLE
// ═══════════════════════════════════════════════
function toggleLock(col) {
  if (slotSpinning[col]) { showToast('스핀 중엔 잠금 불가!'); return; }
  slotLocked[col] = !slotLocked[col];
  const btn  = document.getElementById('lockBtn'  + col);
  const slot = document.getElementById('slot'     + col);
  if (slotLocked[col]) {
    btn.className  = 'lock-btn locked';
    btn.textContent = '🔒 고정됨';
    slot.classList.add('locked');
    showCat('🔒 ' + idxToLetter(slotIdx[col]) + ' 고정!');
  } else {
    btn.className  = 'lock-btn unlocked';
    btn.textContent = '🔓 잠금';
    slot.classList.remove('locked');
    showCat('🔓 잠금 해제');
  }
}

// ═══════════════════════════════════════════════
//  SPIN ENGINE
// ═══════════════════════════════════════════════
function spin() {
  document.getElementById('spinBtn').disabled   = true;
  document.getElementById('stopAllBtn').disabled = false;
  document.getElementById('resultMatch').className = 'result-match';

  let allDoneImmediately = true;

  for (let c = 0; c < numSlots; c++) {
    const rw = document.getElementById('rw' + c);
    if (slotLocked[c]) {
      // Keep current letter, mark done
      const sb = document.getElementById('stopBtn' + c);
      if (sb) { sb.disabled = true; sb.className = 'stop-btn done'; sb.textContent = '🔒 고정'; }
      if (rw) rw.classList.remove('spinning');
    } else {
      allDoneImmediately = false;
      startSlotSpin(c);
      if (rw) rw.classList.add('spinning');
    }
  }

  if (allDoneImmediately) onAllLanded();
}

function startSlotSpin(col) {
  slotSpinning[col] = true;
  const sb = document.getElementById('stopBtn' + col);
  if (sb) { sb.disabled = false; sb.className = 'stop-btn'; sb.textContent = '■ STOP'; }

  // Target: random letter, land at least 4 full rotations away
  const minAdvance = 26 * 4;
  const advance    = minAdvance + Math.floor(Math.random() * 26 * 3);
  // Spin backward (strip moves up = letters advance forward)
  // We go to startIdx - advance (wrapping within strip)
  const targetIdx  = Math.max(26, Math.min(STRIP_N - 26, slotIdx[col] - advance));
  const dur        = 2200 + col * 350 + Math.random() * 500;

  // Multi-phase: fast scroll then decelerate
  const inner    = document.getElementById('inner' + col);
  const startY   = idxToY(slotIdx[col]);
  const endY     = idxToY(targetIdx);
  const startT   = performance.now();

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function frame(now) {
    if (!slotSpinning[col]) return;
    const elapsed = now - startT;
    const t = Math.min(elapsed / dur, 1);
    // Fast phase 0→0.7, decelerate 0.7→1
    let y;
    if (t < 0.7) {
      // accelerate to max speed
      const p = t / 0.7;
      y = startY + (endY - startY) * (1 - Math.pow(1 - p, 2)) * 0.65;
    } else {
      // ease into final position
      const p = (t - 0.7) / 0.3;
      const midY = startY + (endY - startY) * 0.65;
      y = midY + (endY - midY) * easeOutCubic(p);
    }
    inner.style.transform = 'translateY(' + y + 'px)';
    if (t < 1) {
      slotRAF[col] = requestAnimationFrame(frame);
    } else {
      landSlot(col, targetIdx);
    }
  }
  if (slotRAF[col]) cancelAnimationFrame(slotRAF[col]);
  slotRAF[col] = requestAnimationFrame(frame);
}

function stopSlot(col) {
  if (!slotSpinning[col]) return;
  // Cancel ongoing animation
  if (slotRAF[col]) { cancelAnimationFrame(slotRAF[col]); slotRAF[col] = null; }
  slotSpinning[col] = false;

  // Find the nearest integer index from current visual position
  const inner = document.getElementById('inner' + col);
  const m = inner ? inner.style.transform.match(/translateY\((-?[\d.]+)px\)/) : null;
  const curY = m ? parseFloat(m[1]) : idxToY(slotIdx[col]);
  const nearest = yToIdx(curY, STRIP_N);

  // Smooth snap to it
  animateTo(col, nearest, 250, () => {
    slotIdx[col] = nearest;
    finishSlot(col);
  });
}

function landSlot(col, targetIdx) {
  slotSpinning[col] = false;
  // After landing, teleport the strip to the equivalent position in the middle
  // so the next spin always has plenty of room in both directions.
  const letter     = ((targetIdx % 26) + 26) % 26;
  const resetIdx   = MID_START + letter;          // same letter, middle of strip
  slotIdx[col]     = resetIdx;
  const inner = document.getElementById('inner' + col);
  if (inner) inner.style.transform = 'translateY(' + idxToY(resetIdx) + 'px)';
  finishSlot(col);
}

function finishSlot(col) {
  const rw = document.getElementById('rw' + col);
  if (rw) { rw.textContent = idxToLetter(slotIdx[col]); rw.classList.remove('spinning'); }
  const sb = document.getElementById('stopBtn' + col);
  if (sb) { sb.disabled = true; sb.className = 'stop-btn done'; sb.textContent = '✓ 완료'; }
  updateResultChar(col);
  checkAllLanded();
}

function stopAll() {
  for (let c = 0; c < numSlots; c++) if (slotSpinning[c]) stopSlot(c);
}

function checkAllLanded() {
  if (slotSpinning.some(Boolean)) return;
  document.getElementById('spinBtn').disabled    = false;
  document.getElementById('stopAllBtn').disabled = true;
  const word = Array.from({length: numSlots}, (_, i) => idxToLetter(slotIdx[i])).join('');
  checkWord(word);
}

function onAllLanded() {
  document.getElementById('spinBtn').disabled    = false;
  document.getElementById('stopAllBtn').disabled = true;
  const word = Array.from({length: numSlots}, (_, i) => idxToLetter(slotIdx[i])).join('');
  checkWord(word);
}

// ═══════════════════════════════════════════════
//  RESULT
// ═══════════════════════════════════════════════
function buildResultWord() {
  const rw = document.getElementById('resultWord');
  rw.innerHTML = Array.from({length: numSlots}, (_, i) =>
    `<span class="rw-char rw-${(i % 4) + 1}" id="rw${i}">${idxToLetter(slotIdx[i])}</span>`
  ).join('');
}

function updateResultChar(col) {
  const rw = document.getElementById('rw' + col);
  if (rw && !slotSpinning[col]) rw.textContent = idxToLetter(slotIdx[col]);
}

function checkWord(word) {
  const matchEl = document.getElementById('resultMatch');
  const match   = sessionWords.find(w => w.word === word);
  if (match && !foundWords.has(word)) {
    foundWords.add(word);
    matchEl.textContent = '🎉 ' + match.emoji + ' "' + word + '" 발견!';
    matchEl.className   = 'result-match show hit';
    document.getElementById('card-' + word)?.classList.add('found');
    updateScoreUI(); addHistory(word, true, match.emoji);
    showCat('🎉 정답!'); launchConfetti();
  } else if (match && foundWords.has(word)) {
    matchEl.textContent = '✅ 이미 찾았어요! ' + match.emoji;
    matchEl.className   = 'result-match show miss';
    addHistory(word, false, '🔄'); showCat('이미 찾은 단어!');
  } else {
    matchEl.textContent = '"' + word + '" — 카드에 없어요 😿';
    matchEl.className   = 'result-match show miss';
    addHistory(word, false, '❌'); showCat('다시 돌려봐요~');
  }
  if (foundWords.size === sessionWords.length && sessionWords.length > 0) {
    setTimeout(() => { showCat('🏆 모두 찾았어요!'); launchConfetti(true); }, 400);
  }
}

// ═══════════════════════════════════════════════
//  EDITOR
// ═══════════════════════════════════════════════
function renderWordGrid() {
  document.getElementById('wordCount').textContent = wordList.length + '개';
  document.getElementById('wordGrid').innerHTML = wordList.map((w, i) => `
    <div class="word-chip">
      <span style="font-size:17px">${w.emoji}</span>
      <span>${w.word}</span>
      <span style="font-size:9px;color:#bbb;font-weight:700">${w.word.length}자</span>
      <button class="chip-del" onclick="removeWord(${i})">×</button>
    </div>`).join('');
}
function addWord() {
  const raw   = document.getElementById('wordInput').value.trim().toUpperCase();
  const emoji = document.getElementById('emojiInput').value.trim() || '📝';
  if (!raw)                              { showToast('단어를 입력해주세요!'); return; }
  if (!/^[A-Z]+$/.test(raw))            { showToast('영문 알파벳만!'); return; }
  if (wordList.find(w => w.word === raw)){ showToast('"' + raw + '" 이미 있어요!'); return; }
  wordList.push({word: raw, emoji});
  document.getElementById('wordInput').value  = '';
  document.getElementById('emojiInput').value = '';
  renderWordGrid(); showToast('✅ "' + raw + '" 추가!');
}
function bulkAdd() {
  const lines = document.getElementById('bulkInput').value.split('\n').map(l => l.trim()).filter(Boolean);
  let added = 0, skip = 0;
  lines.forEach(line => {
    const p = line.split(/\s+/), w = p[0]?.toUpperCase(), e = p[1] || '📝';
    if (!w || !/^[A-Z]+$/.test(w) || wordList.find(x => x.word === w)) { skip++; return; }
    wordList.push({word: w, emoji: e}); added++;
  });
  document.getElementById('bulkInput').value = '';
  renderWordGrid(); showToast('✅ ' + added + '개 추가 (' + skip + '개 건너뜀)');
}
function removeWord(i) { wordList.splice(i, 1); renderWordGrid(); }
function clearAll()    { if (!confirm('모두 삭제?')) return; wordList = []; renderWordGrid(); }
function applyToGame() {
  if (!wordList.length) { showToast('단어를 추가하세요!'); return; }
  sessionWords = [...wordList];
  resetGame(); switchTab('game'); showToast('🎮 게임 적용!');
}

// ═══════════════════════════════════════════════
//  SCORE / HISTORY / CARDS
// ═══════════════════════════════════════════════
function addHistory(word, hit, emoji) {
  history.unshift({word, hit, emoji}); if (history.length > 20) history.pop();
  document.getElementById('historyLog').innerHTML = history.map(h => `
    <div class="history-item">
      <span>${h.emoji}</span>
      <span class="h-word ${h.hit ? 'h-hit' : 'h-miss'}">${h.word}</span>
      <span style="font-size:10px;color:#aaa;margin-left:auto">${h.hit ? '✓발견' : '미스'}</span>
    </div>`).join('');
}
function updateScoreUI() {
  document.getElementById('scoreNum').textContent = foundWords.size;
  document.getElementById('foundList').innerHTML  = [...foundWords].map(w => `<div class="found-tag">${w}</div>`).join('');
}
function buildWordCards() {
  const c = document.getElementById('wordCards');
  c.innerHTML = '';
  document.getElementById('totalWords').textContent = sessionWords.length;
  sessionWords.forEach(({word, emoji}) => {
    const card = document.createElement('div');
    card.className = 'word-card'; card.id = 'card-' + word;
    card.innerHTML = '<span class="card-emoji">' + emoji + '</span>' + word;
    c.appendChild(card);
  });
}

// ═══════════════════════════════════════════════
//  TABS / RESET
// ═══════════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) =>
    b.classList.toggle('active', ['game', 'editor'][i] === tab));
  document.getElementById('panel-game').classList.toggle('active', tab === 'game');
  document.getElementById('panel-editor').classList.toggle('active', tab === 'editor');
  if (tab === 'editor') renderWordGrid();
}

function resetGame() {
  foundWords = new Set(); history = [];
  buildSlots(); buildWordCards(); updateScoreUI();
  document.getElementById('historyLog').innerHTML = '<div style="font-size:11px;color:#aaa">스핀을 눌러봐요!</div>';
  document.getElementById('resultMatch').className = 'result-match';
  document.getElementById('spinBtn').disabled    = false;
  document.getElementById('stopAllBtn').disabled = true;
}

// ═══════════════════════════════════════════════
//  CAT SPEECH / TOAST
// ═══════════════════════════════════════════════
function showCat(msg) {
  const el = document.getElementById('catSpeech');
  el.textContent = msg; el.classList.remove('show'); void el.offsetWidth;
  el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2400);
}
let toastT = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

// ═══════════════════════════════════════════════
//  CONFETTI
// ═══════════════════════════════════════════════
const cvs = document.getElementById('confetti-canvas'), cctx = cvs.getContext('2d');
let particles = [], confRAF = null;
function launchConfetti(big = false) {
  cvs.width = innerWidth; cvs.height = innerHeight;
  const colors = ['#F5A623','#E53935','#43A047','#1E88E5','#8E24AA','#FFD878','#fff'];
  for (let i = 0; i < (big ? 160 : 70); i++)
    particles.push({x: Math.random() * cvs.width, y: -10, w: 7 + Math.random() * 9, h: 4 + Math.random() * 4,
      color: colors[0 | Math.random() * colors.length], vx: (Math.random() - .5) * 5,
      vy: 2 + Math.random() * 4, rot: Math.random() * 360, rs: (Math.random() - .5) * 9});
  if (!confRAF) animateConf();
}
function animateConf() {
  cctx.clearRect(0, 0, cvs.width, cvs.height);
  particles = particles.filter(p => p.y < cvs.height + 20);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += .09; p.rot += p.rs;
    cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.rot * Math.PI / 180);
    cctx.fillStyle = p.color; cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cctx.restore();
  });
  particles.length ? confRAF = requestAnimationFrame(animateConf) : (confRAF = null, cctx.clearRect(0, 0, cvs.width, cvs.height));
}

// ═══════════════════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (!document.getElementById('panel-game').classList.contains('active')) return;
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); spin(); }
  if (e.code === 'Enter') { e.preventDefault(); stopAll(); }
  const n = parseInt(e.key);
  if (n >= 1 && n <= numSlots) { e.preventDefault(); stopSlot(n - 1); }
});
